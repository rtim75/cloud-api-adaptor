name: Publish attested GCP CDH

# Temporary branch integration proof; publish only to the isolated test package.
# The PR build job remains unprivileged and never publishes signed artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - denys/gcp-provider

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/denys/gcp-provider'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    container:
      image: rust:1.90.0-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f
    defaults:
      run:
        shell: bash
        working-directory: src/cloud-api-adaptor
    steps:
      - name: Checkout the workflow source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cryptsetup-bin protobuf-compiler libclang-dev libssl-dev pkg-config python3-yaml
      - name: Build and test patched CDH
        id: build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          guest_ref=$(python3 -c 'import yaml; print(yaml.safe_load(open("versions.yaml"))["oci"]["guest-components"]["reference"])')
          output="$RUNNER_TEMP/gcp-cdh"
          podvm/hack/build-gcp-cdh.sh "$guest_ref" x86_64 "$output/confidential-data-hub" --test
          printf 'caa-source=%s\narch=x86_64\n' "$GITHUB_SHA" >> "$output/confidential-data-hub.build-info"
          echo "ORAS_VERSION=$(python3 -c 'import yaml; print(yaml.safe_load(open("versions.yaml"))["tools"]["oras"])')" >> "$GITHUB_ENV"
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Publish CDH binary and build inputs as one OCI subject
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin
          cd "$RUNNER_TEMP/gcp-cdh"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/gcp-cdh-branch-test"
          oras push --format json --artifact-type application/vnd.coco.gcp-cdh.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "$image:branch-test-$GITHUB_SHA-amd64" confidential-data-hub:application/octet-stream \
            confidential-data-hub.build-info:text/plain > "$RUNNER_TEMP/gcp-cdh-push.json"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/gcp-cdh-push.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'GCP_CDH_ARTIFACT=%s@%s\nGCP_CDH_REF=%s\n' "$image" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the downstream OCI artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
