#
# Build and push the pod VM images.
---
name: Publish pod VM Images
on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Container registry to push images to (e.g., quay.io/your-username)'
        required: false
        type: string
        default: ''
      cloud-provider:
        description: 'Use gcp for the patched GCP CDH image; empty keeps the native image.'
        default: ''
        required: false
        type: string
      gcp-cdh-artifact:
        description: 'Attested downstream GCP CDH OCI reference including @sha256 digest.'
        default: ''
        required: false
        type: string
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to build from'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Image tag to use'
        required: false
        type: string
        default: ''
      registry:
        description: 'Container registry to push images to (e.g., quay.io/your-username)'
        required: false
        type: string
        default: ''
      cloud-provider:
        description: 'Use gcp for the patched GCP CDH image; empty keeps the native image.'
        default: ''
        required: false
        type: string
      gcp-cdh-artifact:
        description: 'Attested downstream GCP CDH OCI reference including @sha256 digest.'
        default: ''
        required: false
        type: string
    secrets:
      QUAY_PASSWORD:
        required: true

permissions: {}

jobs:
  podvm:
    uses: ./.github/workflows/podvm_mkosi.yaml
    permissions:
      contents: read  # Required to checkout code
      packages: write  # Required to push container images
      id-token: write  # Required for OIDC authentication
      attestations: write  # Required to write attestations
      artifact-metadata: write  # Required by podvm_mkosi.yaml to write attestation metadata
    strategy:
      fail-fast: false
      matrix:
        # The signed GCP producer currently targets x86_64; native coverage stays unchanged.
        arch: ${{ inputs.cloud-provider == 'gcp' && fromJSON('["amd64"]') || fromJSON('["amd64","s390x","arm64"]') }}
    with:
      git_ref: ${{ inputs.git_ref || github.sha }}
      image_tag: ${{ inputs.image_tag || github.sha }}
      arch: ${{ matrix.arch}}
      debug: false
      cloud-provider: ${{ inputs.cloud-provider }}
      gcp-cdh-artifact: ${{ inputs.gcp-cdh-artifact }}
      registry: ${{ inputs.registry != '' && inputs.registry || (github.repository == 'confidential-containers/cloud-api-adaptor' && 'quay.io/confidential-containers' || format('ghcr.io/{0}', github.repository_owner)) }}
    secrets:
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
